[versions]
agp = "9.1.1"
kotlin = "2.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
composeBom = "2026.06.00"
camerax = "1.6.0"
mlkitFaceDetection = "16.1.7"
lifecycleProcess = "2.9.4"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
junit = "4.13.2"
mockitoKotlin = "5.4.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
vitallensCore = "0.3.3"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleProcess" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

mlkit-face-detection = { module = "com.google.mlkit:face-detection", version.ref = "mlkitFaceDetection" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

junit = { module = "junit:junit", version.ref = "junit" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
# androidTest-only (never affects the published AAR's dependency graph): real-device/emulator
# instrumented tests for code that can't be meaningfully verified on a plain JVM (CameraX session
# wiring, ML Kit detection, MediaMetadataRetriever decode).
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

# Generated UniFFI Kotlin bindings + native libs for the Rust core (vitallens-core).
# Published as an .aar; packaging="aar" in its POM, so this must resolve via
# an Android-aware configuration (i.e. only from an com.android.library module).
vitallens-core = { module = "com.rouast:vitallens-core", version.ref = "vitallensCore" }
# Desktop JVM twin of the above: same com.rouast.vitallens.core package and Kotlin
# bindings, but bundles darwin-aarch64/darwin-x86-64/linux-x86-64 native libs in a
# plain jar (not an AAR) so real Rust-backed UniFFI objects (BufferPlanner, Session)
# work inside plain `./gradlew test` JVM runs. Test/dev-only — never a main
# dependency, never ships in the AAR we publish.
vitallens-core-jvm = { module = "com.rouast:vitallens-core-jvm", version.ref = "vitallensCore" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
